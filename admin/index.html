<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="#59612d" name="theme-color"/>
<title>Painel — Crislany &amp; Jardel</title>
<style>
:root{--olive:#59612d;--olive2:#78834b;--gold:#b49a62;--cream:#faf8f1;--ink:#343725;--muted:#777967}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
.wrap{max-width:860px;margin:auto;padding:1.5rem 1.1rem 5rem}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
h1{font-size:2rem;font-weight:400;color:var(--olive);margin:.2rem 0}
h2{font-size:1.4rem;font-weight:400;color:var(--olive);margin:0 0 1rem}
.card{background:#fff;border:1px solid #e6dfcf;border-radius:10px;padding:1.5rem;margin-bottom:1.3rem;box-shadow:0 6px 20px rgba(60,60,30,.05)}
label{display:block;font-size:.8rem;color:var(--muted);margin:.7rem 0 .25rem;letter-spacing:.03em}
input,textarea{width:100%;padding:.75rem;border:1px solid #cfd3bb;border-radius:8px;background:#fff;font-family:inherit;font-size:1rem}
textarea{min-height:90px;resize:vertical}
button{font-family:inherit;cursor:pointer;border:0;border-radius:8px;padding:.7rem 1.1rem;letter-spacing:.03em}
.btn{background:var(--olive);color:#fff}.btn:hover{background:#414923}
.btn-gold{background:var(--gold);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--olive);color:var(--olive)}
.btn-del{background:transparent;border:1px solid #b06a5c;color:#a3402f;padding:.5rem .8rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.conf{display:flex;justify-content:space-between;align-items:center;gap:1rem;border-bottom:1px solid #eee4d2;padding:.8rem 0}
.conf .nome{font-size:1.02rem}.conf .data{font-size:.78rem;color:var(--muted)}
.gift-row{border:1px solid #ece4d2;border-radius:8px;padding:1rem;margin-bottom:.8rem}
.gift-row .grid{display:grid;grid-template-columns:70px 1fr 100px 80px;gap:.5rem}
.msg{font-size:.9rem;margin:.5rem 0;min-height:1.1em}.msg.ok{color:var(--olive)}.msg.err{color:#a3402f}
.hidden{display:none}
.login-box{max-width:380px;margin:12vh auto;background:#fff;border:1px solid #e6dfcf;border-radius:12px;padding:2rem}
.count{color:var(--muted);font-weight:400;font-size:1rem}
@media(max-width:640px){.gift-row .grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h1 style="font-size:1.6rem">Painel</h1>
    <p class="count">Acesso restrito aos noivos.</p>
    <label>Usuário</label>
    <input id="user" placeholder="Usuário" autocomplete="username"/>
    <label>Senha</label>
    <input id="pass" type="password" placeholder="Senha" autocomplete="current-password"/>
    <p class="msg" id="loginMsg"></p>
    <button class="btn" style="width:100%;margin-top:.6rem" onclick="doLogin()" id="loginBtn">Entrar</button>
  </div>
</div>

<!-- PAINEL -->
<div id="panel" class="wrap hidden">
  <div class="topbar">
    <h1>Painel dos Noivos</h1>
    <button class="btn-ghost" onclick="logout()">Sair</button>
  </div>

  <div class="card">
    <h2>Texto do popup de presença</h2>
    <label>Título</label>
    <input id="cTitulo" placeholder="Título"/>
    <label>Texto personalizado</label>
    <textarea id="cTexto" placeholder="Texto personalizado"></textarea>
    <label>Texto do botão</label>
    <input id="cBotao" placeholder="Texto do botão"/>
    <p class="msg" id="cMsg"></p>
    <button class="btn" onclick="saveConfig()">Salvar texto</button>
  </div>

  <div class="card">
    <h2>Confirmações recebidas <span class="count" id="confCount"></span></h2>
    <p class="msg" id="confMsg"></p>
    <div id="confList"></div>
  </div>

  <div class="card">
    <h2>Presentes</h2>
    <p class="msg" id="giftMsg"></p>
    <div id="giftList"></div>
    <button class="btn-gold" style="margin-top:.6rem" onclick="addGift()">+ Adicionar presente</button>
  </div>
</div>

<script src="../config.js"></script>
<script>
var C = window.APP_CONFIG;
var PW = null;

function money(v){ return 'R$ ' + Number(v||0).toFixed(2).replace('.', ','); }
function fmtDate(s){ try{ var d=new Date(s); return d.toLocaleString('pt-BR'); }catch(e){ return s; } }

async function api(action, extra){
  var body = Object.assign({action:action, password:PW}, extra||{});
  var r = await fetch(C.FN_ADMIN, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  var d = await r.json().catch(function(){return {};});
  if(!r.ok) throw new Error(d.error||('erro '+r.status));
  return d;
}

// ---- LOGIN ----
async function doLogin(){
  var msg=document.getElementById('loginMsg'); msg.className='msg'; msg.textContent='';
  var pass=document.getElementById('pass').value;
  if(!pass){ msg.textContent='Informe a senha.'; msg.classList.add('err'); return; }
  var btn=document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='Entrando…';
  try{
    PW=pass;
    await api('login');
    sessionStorage.setItem('cj_pw', pass);
    showPanel();
  }catch(e){
    PW=null; msg.textContent='Senha incorreta.'; msg.classList.add('err');
  }
  btn.disabled=false; btn.textContent='Entrar';
}
function logout(){ PW=null; sessionStorage.removeItem('cj_pw'); document.getElementById('panel').classList.add('hidden'); document.getElementById('login').classList.remove('hidden'); }
function showPanel(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  loadConfig(); loadConfs(); loadGifts();
}

// ---- CONFIG ----
async function loadConfig(){
  try{
    var r=await fetch(C.SUPA_URL+'/rest/v1/config?select=*&id=eq.1',{headers:{apikey:C.SUPA_ANON,Authorization:'Bearer '+C.SUPA_ANON}});
    var d=await r.json(); if(d&&d[0]){
      document.getElementById('cTitulo').value=d[0].popup_titulo||'';
      document.getElementById('cTexto').value=d[0].popup_texto||'';
      document.getElementById('cBotao').value=d[0].popup_botao||'';
    }
  }catch(e){}
}
async function saveConfig(){
  var msg=document.getElementById('cMsg'); msg.className='msg'; msg.textContent='Salvando…';
  try{
    await api('update_config',{popup_titulo:document.getElementById('cTitulo').value,popup_texto:document.getElementById('cTexto').value,popup_botao:document.getElementById('cBotao').value});
    msg.textContent='Texto salvo!'; msg.classList.add('ok');
  }catch(e){ msg.textContent='Erro: '+e.message; msg.classList.add('err'); }
}

// ---- CONFIRMAÇÕES ----
async function loadConfs(){
  var list=document.getElementById('confList'); var msg=document.getElementById('confMsg'); msg.textContent='';
  list.innerHTML='<p class="count">Carregando…</p>';
  try{
    var d=await api('list_confirmacoes');
    var arr=d.data||[];
    document.getElementById('confCount').textContent='('+arr.length+')';
    if(!arr.length){ list.innerHTML='<p class="count">Nenhuma confirmação ainda.</p>'; return; }
    list.innerHTML='';
    arr.forEach(function(c){
      var div=document.createElement('div'); div.className='conf';
      div.innerHTML='<div><div class="nome">'+escapeHtml(c.nomes)+'</div><div class="data">'+fmtDate(c.created_at)+'</div></div>';
      var b=document.createElement('button'); b.className='btn-del'; b.textContent='Excluir';
      b.onclick=function(){ delConf(c.id, div); };
      div.appendChild(b); list.appendChild(div);
    });
  }catch(e){ list.innerHTML=''; msg.textContent='Erro: '+e.message; msg.classList.add('err'); }
}
async function delConf(id, el){
  if(!confirm('Excluir esta confirmação?')) return;
  try{ await api('delete_confirmacao',{id:id}); loadConfs(); }
  catch(e){ alert('Erro: '+e.message); }
}

// ---- PRESENTES ----
var GIFTS=[];
async function loadGifts(){
  var list=document.getElementById('giftList'); list.innerHTML='<p class="count">Carregando…</p>';
  try{
    var d=await api('list_presentes'); GIFTS=d.data||[]; renderGifts();
  }catch(e){ list.innerHTML='<p class="msg err">Erro: '+e.message+'</p>'; }
}
function renderGifts(){
  var list=document.getElementById('giftList'); list.innerHTML='';
  GIFTS.forEach(function(g,i){
    var row=document.createElement('div'); row.className='gift-row';
    row.innerHTML=
      '<div class="grid">'+
        '<div><label>Ordem</label><input type="number" value="'+(g.ordem||0)+'" data-f="ordem"></div>'+
        '<div><label>Título</label><input value="'+escapeAttr(g.titulo||'')+'" data-f="titulo"></div>'+
        '<div><label>Valor (R$)</label><input type="number" value="'+(g.valor||0)+'" data-f="valor"></div>'+
        '<div style="display:flex;align-items:flex-end"><button class="btn-del" style="width:100%">Excluir</button></div>'+
      '</div>'+
      '<label>Imagem (caminho ou URL)</label><input value="'+escapeAttr(g.imagem||'')+'" data-f="imagem">'+
      '<label>Descrição (opcional)</label><input value="'+escapeAttr(g.descricao||'')+'" data-f="descricao">'+
      '<div class="row" style="margin-top:.7rem"><button class="btn">Salvar</button><span class="msg" style="margin:0"></span></div>';
    var inputs=row.querySelectorAll('input');
    function collect(){ var o={id:g.id}; inputs.forEach(function(inp){ o[inp.dataset.f]=inp.value; }); o.valor=Number(o.valor); o.ordem=Number(o.ordem); return o; }
    row.querySelector('.btn').onclick=async function(){
      var m=row.querySelector('.msg'); m.className='msg'; m.textContent='Salvando…';
      try{ await api('save_presente',collect()); m.textContent='Salvo!'; m.classList.add('ok'); }
      catch(e){ m.textContent='Erro: '+e.message; m.classList.add('err'); }
    };
    row.querySelector('.btn-del').onclick=async function(){
      if(!confirm('Excluir o presente "'+(g.titulo||'')+'"?')) return;
      if(g.id){ try{ await api('delete_presente',{id:g.id}); loadGifts(); }catch(e){ alert('Erro: '+e.message); } }
      else { GIFTS.splice(i,1); renderGifts(); }
    };
    list.appendChild(row);
  });
}
function addGift(){
  var maxOrd=GIFTS.reduce(function(m,g){return Math.max(m,g.ordem||0);},0);
  GIFTS.push({titulo:'Novo presente',valor:0,ordem:maxOrd+1,imagem:'',descricao:''});
  renderGifts();
  document.getElementById('giftList').lastChild.scrollIntoView({behavior:'smooth',block:'center'});
}

function escapeHtml(s){ return (s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// Auto-login se já logado nesta aba
(function(){
  var saved=sessionStorage.getItem('cj_pw');
  if(saved){ PW=saved; api('login').then(showPanel).catch(function(){ sessionStorage.removeItem('cj_pw'); PW=null; }); }
})();
document.getElementById('pass').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
